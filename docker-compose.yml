services:
  app:
    build: .
    env_file: .env
    volumes:
      - ./data:/data
    ports:
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-8000}:8000"
    # Shares the server with other apps (e.g. a trading bot): never take the whole machine.
    cpus: "${APP_CPUS:-0.75}"
    mem_limit: "${APP_MEM:-2g}"
    restart: unless-stopped

  # HTTPS with your own domain (needed to record your voice from the phone).
  caddy:
    image: caddy:2
    profiles: ["https"]
    env_file: .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - app
    restart: unless-stopped

volumes:
  caddy_data:
